name: probe polymarket data api

# Temporary: checks Polymarket's public data API from outside India, where it is blocked. No secrets used.
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize the v2 OpenAPI spec
        run: |
          curl -sSL --max-time 30 https://data-api.polymarket.com/v2/openapi.json -o spec.json
          python3 - <<'PY'
          import json
          s = json.load(open("spec.json"))
          comps = s.get("components", {}).get("schemas", {})
          def ref(o):
              while isinstance(o, dict) and "$ref" in o:
                  o = comps.get(o["$ref"].split("/")[-1], {})
              return o
          def fields(schema, depth=0):
              schema = ref(schema)
              if schema.get("type") == "array" or "items" in schema:
                  return fields(schema.get("items", {}), depth)
              props = schema.get("properties", {})
              out = []
              for k, v in props.items():
                  v2 = ref(v)
                  t = v2.get("type", "obj")
                  if k == "data" and depth == 0:
                      out.append("data[]: " + ", ".join(fields(v2, 1)))
                  elif t in ("array", "object") and depth < 2 and (v2.get("properties") or v2.get("items")):
                      out.append(f"{k}{{" + ", ".join(fields(v2, depth + 1)) + "}")
                  else:
                      out.append(f"{k}:{t}")
              return out
          for path, ops in s.get("paths", {}).items():
              for m, op in ops.items():
                  if m != "get": continue
                  params = []
                  for p in op.get("parameters", []):
                      p = ref(p); sc = ref(p.get("schema", {}))
                      extra = ("=" + "|".join(map(str, sc["enum"]))) if "enum" in sc else ""
                      params.append(f"{p.get('name')}{'*' if p.get('required') else ''}{extra}")
                  print(f"\n## GET {path}  -- {op.get('summary','')}")
                  print("params:", ", ".join(params))
                  r = op.get("responses", {}).get("200", {}).get("content", {}).get("application/json", {}).get("schema", {})
                  if path.rstrip("/").split("/")[-1] in ("holders", "positions", "leaderboard", "closed-positions", "closed_positions", "activity") or "closed" in path:
                      print("fields:", "; ".join(fields(r)))
          PY
