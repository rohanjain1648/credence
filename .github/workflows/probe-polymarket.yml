name: probe polymarket data api

# Temporary: checks Polymarket's public data API from outside India, where it is blocked. No secrets used.
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call public endpoints and docs
        run: |
          M=0x5db999fad322cea2914535aae5517060c3f80ad6d8c0231cde2124a434d16846
          W=0x56687bf447db6ffa42ffe2204a05edaa20f55839
          show() { echo "=== $1"; curl -sSL --max-time 20 -w "\nHTTP %{http_code}\n" "$1" | head -c "${2:-2500}"; echo; }
          show "https://data-api.polymarket.com/v2/" 6000
          show "https://data-api.polymarket.com/v2/holders?market=$M&limit=2"
          show "https://data-api.polymarket.com/v2/closed-positions?user=$W&limit=2"
          show "https://data-api.polymarket.com/v2/leaderboard?category=SPORTS&timePeriod=MONTH&limit=2"
          show "https://docs.polymarket.com/llms.txt" 8000
          curl -sSL --max-time 20 "https://docs.polymarket.com/api-reference/data-api/overview" | sed -e 's/<script[^>]*>[^<]*<\/script>//g' -e 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | grep -o -i -E ".{0,200}(v2|retir|migrat|holders|closed-positions|leaderboard).{0,200}" | head -30
